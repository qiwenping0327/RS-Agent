<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid">
  <rect width="1600" height="900" fill="#0b1220"/>
  <text x="800" y="60" text-anchor="middle" font-family="Segoe UI,Arial" font-size="26" fill="#fff" font-weight="700">主界面导览</text>
  <text x="800" y="90" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#94a3b8">三栏布局 · 9 大功能页签</text>

  <!-- App shell -->
  <g transform="translate(150 140)">
    <rect width="1300" height="700" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Title bar -->
    <rect width="1300" height="36" rx="12" fill="#1e293b"/>
    <circle cx="20" cy="18" r="6" fill="#ef4444"/>
    <circle cx="40" cy="18" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="18" r="6" fill="#22c55e"/>
    <text x="650" y="24" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#94a3b8">RsAgent</text>

    <!-- Sidebar -->
    <rect x="0" y="36" width="260" height="664" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <!-- Project header -->
    <rect x="0" y="36" width="260" height="60" fill="#1e293b"/>
    <circle cx="34" cy="66" r="14" fill="#2563eb"/>
    <text x="34" y="71" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#fff" font-weight="700">R</text>
    <text x="62" y="60" font-family="Segoe UI,Arial" font-size="14" fill="#e2e8f0" font-weight="600">遥感分析项目</text>
    <text x="62" y="80" font-family="Segoe UI,Arial" font-size="11" fill="#64748b">3 个会话 · 最近活跃</text>
    <!-- Project/session list -->
    <g transform="translate(0 96)" font-family="Segoe UI,Arial" font-size="13">
      <rect x="12" y="0" width="236" height="32" rx="6" fill="#2563eb" opacity="0.18" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="30" cy="16" r="3.5" fill="#22c55e"/>
      <text x="46" y="21" fill="#e2e8f0">NDVI 植被分析</text>
      <text x="46" y="21" text-anchor="end" x="238" fill="#64748b" font-size="10" transform="translate(190 0)">刚刚</text>

      <rect x="12" y="44" width="236" height="32" rx="6" fill="transparent"/>
      <circle cx="30" cy="60" r="3.5" fill="#64748b"/>
      <text x="46" y="65" fill="#94a3b8">水体提取 · 长江流域</text>

      <rect x="12" y="88" width="236" height="32" rx="6" fill="transparent"/>
      <circle cx="30" cy="104" r="3.5" fill="#64748b"/>
      <text x="46" y="109" fill="#94a3b8">城市扩张变化检测</text>
    </g>
    <!-- New session button -->
    <rect x="20" y="310" width="220" height="36" rx="8" fill="#2563eb"/>
    <text x="130" y="334" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#fff" font-weight="600">+ 新建会话</text>

    <!-- Sidebar footer actions -->
    <g transform="translate(0 580)" font-family="Segoe UI,Arial" font-size="13">
      <rect x="12" y="0" width="236" height="36" rx="6" fill="transparent"/>
      <text x="38" y="23" fill="#cbd5e1">📂 新建项目</text>
      <rect x="12" y="44" width="236" height="36" rx="6" fill="transparent"/>
      <text x="38" y="67" fill="#cbd5e1">⚙  设置</text>
    </g>

    <!-- Breadcrumb / tab bar area -->
    <rect x="260" y="36" width="1040" height="60" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
    <text x="284" y="60" font-family="Segoe UI,Arial" font-size="13" fill="#64748b">遥感分析项目</text>
    <text x="392" y="60" font-family="Segoe UI,Arial" font-size="13" fill="#475569">/</text>
    <text x="406" y="60" font-family="Segoe UI,Arial" font-size="13" fill="#e2e8f0" font-weight="600">💬 对话</text>
    <text x="406" y="78" font-family="Segoe UI,Arial" font-size="11" fill="#64748b">NDVI 植被指数分析 · 2024 北京</text>

    <!-- Top tabs (9) -->
    <g transform="translate(860 48)" font-family="Segoe UI,Arial" font-size="12">
      <g>
        <rect x="0" y="0" width="86" height="32" rx="6" fill="#1e293b"/>
        <text x="43" y="21" text-anchor="middle" fill="#e2e8f0" font-weight="600">💬 对话</text>
      </g>
      <g transform="translate(92 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">📁 文件</text>
      </g>
      <g transform="translate(184 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">✨ 技能</text>
      </g>
      <g transform="translate(276 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">📊 仪表盘</text>
      </g>
      <g transform="translate(368 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">🗄️ 记忆</text>
      </g>
      <g transform="translate(460 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">🔧 工具</text>
      </g>
      <g transform="translate(552 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">📖 知识库</text>
      </g>
      <g transform="translate(644 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">🛰 遥感</text>
      </g>
      <g transform="translate(736 0)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="transparent"/>
        <text x="43" y="21" text-anchor="middle" fill="#64748b">📡 常驻</text>
      </g>
    </g>

    <!-- Main body: Chat area -->
    <g transform="translate(260 96)">
      <!-- Messages -->
      <g transform="translate(24 24)">
        <!-- User message -->
        <rect x="0" y="0" width="660" height="60" rx="12" fill="#1e293b"/>
        <circle cx="30" cy="30" r="14" fill="#f59e0b"/>
        <text x="30" y="35" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#fff" font-weight="700">你</text>
        <text x="58" y="30" font-family="Segoe UI,Arial" font-size="13" fill="#e2e8f0">帮我下载北京市 2024 年 7 月的 Sentinel-2 影像并计算 NDVI</text>
      </g>
      <g transform="translate(24 110)">
        <!-- AI message -->
        <rect x="0" y="0" width="960" height="150" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
        <circle cx="30" cy="30" r="14" fill="#2563eb"/>
        <text x="30" y="35" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#fff" font-weight="700">AI</text>
        <text x="58" y="30" font-family="Segoe UI,Arial" font-size="13" fill="#e2e8f0" font-weight="600">好的，我来帮你完成。正在执行以下步骤：</text>
        <!-- Tool calls -->
        <g transform="translate(58 50)" font-family="Consolas, monospace" font-size="11">
          <rect x="0" y="0" width="880" height="26" rx="4" fill="#0f172a"/>
          <text x="12" y="17" fill="#22c55e">✓</text>
          <text x="36" y="17" fill="#60a5fa">rs_download</text>
          <text x="160" y="17" fill="#94a3b8">下载 Sentinel-2 影像（2024-07 · 北京）</text>
          <rect x="0" y="32" width="880" height="26" rx="4" fill="#0f172a"/>
          <text x="12" y="49" fill="#22c55e">✓</text>
          <text x="36" y="49" fill="#60a5fa">rs_preprocess</text>
          <text x="160" y="49" fill="#94a3b8">辐射校正 · 裁剪至北京市范围</text>
          <rect x="0" y="64" width="880" height="26" rx="4" fill="#0b1220" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 3"/>
          <circle cx="12" cy="77" r="5" fill="#3b82f6">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/>
          </circle>
          <text x="36" y="81" fill="#60a5fa">rs_analyze</text>
          <text x="160" y="81" fill="#cbd5e1">计算 NDVI 植被指数（进行中）</text>
        </g>
      </g>

      <!-- Composer -->
      <g transform="translate(24 500)">
        <rect x="0" y="0" width="992" height="68" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <text x="20" y="40" font-family="Segoe UI,Arial" font-size="13" fill="#64748b">输入消息...（按 Enter 发送 · 输入 / 呼出命令菜单）</text>
        <rect x="900" y="18" width="72" height="32" rx="8" fill="#2563eb"/>
        <text x="936" y="39" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#fff" font-weight="600">发送 ↑</text>
      </g>
    </g>
  </g>
</svg>
