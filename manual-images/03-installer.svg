<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid">
  <rect width="1200" height="900" fill="#f1f5f9"/>
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" fill="#0f172a" font-weight="700">安装向导</text>
  <text x="600" y="102" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#475569">Windows NSIS 安装流程示意</text>

  <!-- Installer Window -->
  <g transform="translate(240 150)">
    <rect width="720" height="560" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Title bar -->
    <rect width="720" height="48" rx="8" fill="#2563eb"/>
    <text x="24" y="32" font-family="Segoe UI,Arial" font-size="16" fill="#fff" font-weight="600">RsAgent 0.0.11 安装向导</text>
    <!-- Left gradient banner -->
    <rect x="0" y="48" width="170" height="512" fill="#1e40af"/>
    <text x="85" y="150" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#fff" font-weight="800">Rs</text>
    <text x="85" y="178" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#93c5fd" font-weight="600">Agent</text>
    <text x="85" y="230" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#bfdbfe">遥感智能分析平台</text>
    <line x1="35" y1="260" x2="135" y2="260" stroke="#3b82f6" stroke-width="1"/>
    <text x="85" y="290" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#bfdbfe">版本 0.0.11</text>
    <text x="85" y="310" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#bfdbfe">Windows x64</text>
    <text x="85" y="330" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#bfdbfe">© 2026</text>

    <!-- Content: Install progress -->
    <text x="210" y="110" font-family="Segoe UI,Arial" font-size="18" fill="#0f172a" font-weight="700">正在安装 RsAgent...</text>
    <text x="210" y="142" font-family="Segoe UI,Arial" font-size="13" fill="#475569">请稍候，安装程序正在将文件复制到您的计算机。</text>

    <!-- Progress bar -->
    <rect x="210" y="200" width="480" height="28" rx="4" fill="#e2e8f0"/>
    <rect x="210" y="200" width="384" height="28" rx="4" fill="#2563eb"/>
    <text x="450" y="220" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#fff" font-weight="700">80%</text>

    <!-- Current file -->
    <text x="210" y="260" font-family="Segoe UI,Arial" font-size="12" fill="#64748b">复制文件:  </text>
    <text x="278" y="260" font-family="Consolas, monospace" font-size="12" fill="#475569">dist\src\mcp\runtime\McpRuntime.js</text>

    <!-- Install path input -->
    <g transform="translate(0 320)">
      <rect x="210" y="0" width="480" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="226" y="28" font-family="Segoe UI,Arial" font-size="12" fill="#475569">安装路径：</text>
      <rect x="226" y="38" width="360" height="24" rx="4" fill="#fff" stroke="#cbd5e1"/>
      <text x="238" y="55" font-family="Consolas, monospace" font-size="11" fill="#334155">C:\Users\...\AppData\Local\Programs\RsAgent</text>
      <rect x="594" y="38" width="86" height="24" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="637" y="55" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#475569">浏览(B)</text>
    </g>

    <!-- Check list -->
    <g transform="translate(0 420)">
      <g>
        <circle cx="230" cy="18" r="9" fill="#22c55e"/>
        <path d="M226 18 L229 21 L235 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="252" y="22" font-family="Segoe UI,Arial" font-size="13" fill="#0f172a">校验磁盘空间</text>
      </g>
      <g transform="translate(0 30)">
        <circle cx="230" cy="18" r="9" fill="#22c55e"/>
        <path d="M226 18 L229 21 L235 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="252" y="22" font-family="Segoe UI,Arial" font-size="13" fill="#0f172a">写入程序文件</text>
      </g>
      <g transform="translate(0 60)">
        <circle cx="230" cy="18" r="9" fill="#3b82f6">
          <animate attributeName="r" values="8;9.5;8" dur="1s" repeatCount="indefinite"/>
        </circle>
        <text x="246" y="22" font-family="Segoe UI,Arial" font-size="11" fill="#fff" font-weight="700">↻</text>
        <text x="252" y="22" font-family="Segoe UI,Arial" font-size="13" fill="#0f172a">创建快捷方式</text>
      </g>
      <g transform="translate(0 90)">
        <circle cx="230" cy="18" r="9" fill="none" stroke="#cbd5e1" stroke-width="2"/>
        <text x="252" y="22" font-family="Segoe UI,Arial" font-size="13" fill="#94a3b8">完成配置</text>
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(0 480)">
      <rect x="590" y="0" width="100" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="640" y="21" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#475569">取消</text>
      <rect x="474" y="0" width="100" height="32" rx="4" fill="#fff" stroke="#cbd5e1"/>
      <text x="524" y="21" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#0f172a">上一步</text>
      <rect x="358" y="0" width="100" height="32" rx="4" fill="#2563eb"/>
      <text x="408" y="21" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#fff" font-weight="600">下一步 →</text>
    </g>
  </g>
</svg>
