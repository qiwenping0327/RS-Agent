<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid">
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" fill="#0f172a" font-weight="700">知识库</text>
  <text x="600" y="102" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#475569">遥感专业知识 · 自主检索 · 持续学习</text>

  <!-- Window -->
  <g transform="translate(180 150)">
    <rect width="840" height="650" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Title bar -->
    <rect width="840" height="42" rx="12" fill="#2563eb"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#22c55e"/>
    <text x="420" y="28" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#fff" font-weight="600">📖 知识库管理</text>

    <!-- Search bar -->
    <g transform="translate(0 58)">
      <rect x="36" y="0" width="640" height="40" rx="20" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="64" y="26" font-family="Segoe UI,Arial" font-size="14" fill="#94a3b8">🔍  搜索遥感知识（支持混合检索 / 向量 / 关键词）</text>
      <circle cx="676" cy="20" r="14" fill="#2563eb"/>
      <text x="676" y="26" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#fff">Q</text>
    </g>

    <!-- Mode pills -->
    <g transform="translate(36 120)" font-family="Segoe UI,Arial" font-size="12">
      <rect x="0" y="0" width="108" height="28" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="54" y="19" text-anchor="middle" fill="#1d4ed8" font-weight="600">混合检索 ✓</text>
      <rect x="118" y="0" width="96" height="28" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="166" y="19" text-anchor="middle" fill="#64748b">向量语义</text>
      <rect x="224" y="0" width="96" height="28" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="272" y="19" text-anchor="middle" fill="#64748b">关键词</text>
      <rect x="332" y="0" width="112" height="28" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="388" y="19" text-anchor="middle" fill="#64748b">🌐 网页搜索</text>
      <rect x="632" y="0" width="136" height="28" rx="14" fill="#22c55e"/>
      <text x="700" y="19" text-anchor="middle" fill="#fff" font-weight="600">+ 新建条目</text>
    </g>

    <!-- Category filter -->
    <g transform="translate(36 170)" font-family="Segoe UI,Arial" font-size="12">
      <text x="0" y="0" fill="#475569" font-weight="600">类型筛选：</text>
      <g transform="translate(84 0)">
        <rect x="0" y="-16" width="84" height="24" rx="12" fill="#1e293b"/>
        <text x="42" y="1" text-anchor="middle" fill="#fff">全部</text>
      </g>
      <g transform="translate(180 0)">
        <rect x="0" y="-16" width="96" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="48" y="1" text-anchor="middle" fill="#475569">地理知识</text>
      </g>
      <g transform="translate(288 0)">
        <rect x="0" y="-16" width="84" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="42" y="1" text-anchor="middle" fill="#475569">工具文档</text>
      </g>
      <g transform="translate(384 0)">
        <rect x="0" y="-16" width="84" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="42" y="1" text-anchor="middle" fill="#475569">最佳实践</text>
      </g>
      <g transform="translate(480 0)">
        <rect x="0" y="-16" width="84" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="42" y="1" text-anchor="middle" fill="#475569">工作流程</text>
      </g>
    </g>

    <!-- List of knowledge entries -->
    <g transform="translate(36 220)" font-family="Segoe UI,Arial">
      <!-- Row 1 -->
      <g>
        <rect x="0" y="0" width="768" height="84" rx="8" fill="#fff" stroke="#e2e8f0"/>
        <rect x="16" y="16" width="64" height="22" rx="4" fill="#dbeafe"/>
        <text x="48" y="31" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">tool_doc</text>
        <text x="94" y="32" font-size="15" fill="#0f172a" font-weight="700">NDVI 指数计算与解读指南</text>
        <text x="94" y="56" font-size="12" fill="#64748b">NDVI = (NIR - R) / (NIR + R)，反映植被绿度与生物量 · 范围 [-1, 1] · 健康植被通常 > 0.5 ……</text>
        <text x="680" y="32" text-anchor="end" font-size="11" fill="#94a3b8">⭐ 4.9 · 引用 128 次</text>
        <text x="680" y="56" text-anchor="end" font-size="11" fill="#94a3b8">2026-07-14 更新</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0 94)">
        <rect x="0" y="0" width="768" height="84" rx="8" fill="#fff" stroke="#e2e8f0"/>
        <rect x="16" y="16" width="76" height="22" rx="4" fill="#dcfce7"/>
        <text x="54" y="31" text-anchor="middle" font-size="11" fill="#166534" font-weight="600">best_practice</text>
        <text x="108" y="32" font-size="15" fill="#0f172a" font-weight="700">水体提取工作流：阈值分割 vs 深度学习</text>
        <text x="108" y="56" font-size="12" fill="#64748b">推荐方案：小水体→ extract_water_bodies（一步完成）· 大区域→SAM2 + 后处理 · 需模型……</text>
        <text x="680" y="32" text-anchor="end" font-size="11" fill="#94a3b8">⭐ 4.8 · 引用 84 次</text>
        <text x="680" y="56" text-anchor="end" font-size="11" fill="#94a3b8">2026-07-28 更新</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0 188)">
        <rect x="0" y="0" width="768" height="84" rx="8" fill="#fff" stroke="#e2e8f0"/>
        <rect x="16" y="16" width="86" height="22" rx="4" fill="#fef3c7"/>
        <text x="59" y="31" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">geoknowledge</text>
        <text x="116" y="32" font-size="15" fill="#0f172a" font-weight="700">Sentinel-2 卫星波段说明与典型应用</text>
        <text x="116" y="56" font-size="12" fill="#64748b">共 13 个波段（B01-B12 含 B8A）· 分辨率 10/20/60m · 时间分辨率 5 天 · 推荐 B04/B08 用……</text>
        <text x="680" y="32" text-anchor="end" font-size="11" fill="#94a3b8">⭐ 4.7 · 引用 61 次</text>
        <text x="680" y="56" text-anchor="end" font-size="11" fill="#94a3b8">2026-06-30 更新</text>
      </g>
      <!-- Row 4 -->
      <g transform="translate(0 282)">
        <rect x="0" y="0" width="768" height="84" rx="8" fill="#fff" stroke="#e2e8f0"/>
        <rect x="16" y="16" width="80" height="22" rx="4" fill="#fce7f3"/>
        <text x="56" y="31" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">workflow</text>
        <text x="110" y="32" font-size="15" fill="#0f172a" font-weight="700">城市扩张变化检测 · 两年期对比流程</text>
        <text x="110" y="56" font-size="12" fill="#64748b">步骤：下载两期影像→辐射归一化→配准（配准误差 < 0.5 像元）→波段差值→阈值判定……</text>
        <text x="680" y="32" text-anchor="end" font-size="11" fill="#94a3b8">⭐ 4.6 · 引用 47 次</text>
        <text x="680" y="56" text-anchor="end" font-size="11" fill="#94a3b8">2026-07-02 更新</text>
      </g>
    </g>

    <!-- Pagination -->
    <g transform="translate(36 580)" font-family="Segoe UI,Arial" font-size="12">
      <text x="0" y="0" fill="#64748b">共 139 条知识 · 当前第 1 / 7 页</text>
      <g transform="translate(600 0)">
        <rect x="0" y="-20" width="32" height="28" rx="4" fill="#2563eb"/>
        <text x="16" y="0" text-anchor="middle" fill="#fff">1</text>
        <rect x="40" y="-20" width="32" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="56" y="0" text-anchor="middle" fill="#64748b">2</text>
        <rect x="80" y="-20" width="32" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="96" y="0" text-anchor="middle" fill="#64748b">3</text>
        <text x="130" y="0" fill="#94a3b8">…</text>
        <rect x="148" y="-20" width="60" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="178" y="0" text-anchor="middle" fill="#475569">下一页 →</text>
      </g>
    </g>
  </g>
</svg>
