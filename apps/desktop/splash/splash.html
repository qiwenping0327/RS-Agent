<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>RsAgent</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --border: #2a3140;
      --text: #e7eaf0;
      --text-dim: #9aa3b2;
      --accent: #4f9cff;
      --success: #4ade80;
      --warning: #fbbf24;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: transparent;
      color: var(--text);
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .tagline {
      color: var(--text-dim);
      font-size: 12px;
      margin-bottom: 24px;
    }
    .progress-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      animation: indeterminate 1.6s infinite ease-in-out;
    }
    .progress-bar.determinate {
      animation: none;
      left: 0;
      transition: width 0.3s ease;
    }
    @keyframes indeterminate {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
    .status {
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      max-width: 100%;
      overflow-wrap: break-word;
    }
    .status.success { color: var(--success); }
    .status.warning { color: var(--warning); }
    .status.error { color: var(--error); }
    .status.loading::after {
      content: '';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }
    .steps {
      width: 100%;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .step-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }
    .step-icon.done {
      background: var(--success);
      color: #000;
    }
    .step-icon.current {
      background: var(--accent);
      color: #fff;
    }
    .step-text {
      flex: 1;
    }
    .step-text.done {
      color: var(--success);
    }
    .footer {
      color: var(--text-dim);
      opacity: 0.55;
      font-size: 10px;
      margin-top: 16px;
    }
    .info-box {
      width: 100%;
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-dim);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="RsAgent" style="width: 80px; height: 80px; margin-bottom: 8px; object-fit: contain;" />
    <div class="logo">RsAgent</div>
    <div class="tagline">本地服务正在启动…</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status loading" id="status">准备中…</div>
    <div class="steps" id="steps">
      <div class="step">
        <div class="step-icon">1</div>
        <div class="step-text">检测 Python 环境</div>
      </div>
      <div class="step">
        <div class="step-icon">2</div>
        <div class="step-text">安装依赖包</div>
      </div>
      <div class="step">
        <div class="step-icon">3</div>
        <div class="step-text">解压运行时资源</div>
      </div>
      <div class="step">
        <div class="step-icon">4</div>
        <div class="step-text">启动本地服务</div>
      </div>
    </div>
    <div class="info-box" id="infoBox" style="display: none;"></div>
    <div class="footer" id="footer"></div>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const footerEl = document.getElementById("footer");
    const progressBar = document.getElementById("progressBar");
    const steps = document.querySelectorAll(".step");
    const infoBox = document.getElementById("infoBox");

    const stepMap = {
      "检测 Python 环境": 0,
      "安装依赖包": 1,
      "解压运行时资源": 2,
      "启动本地服务": 3,
    };

    function updateStep(text, isDone = false, info = null) {
      const stepIndex = stepMap[text];
      if (stepIndex !== undefined) {
        steps.forEach((step, index) => {
          const icon = step.querySelector(".step-icon");
          const stepText = step.querySelector(".step-text");
          if (index < stepIndex || (index === stepIndex && isDone)) {
            icon.textContent = "✓";
            icon.classList.add("done");
            icon.classList.remove("current");
            stepText.classList.add("done");
          } else if (index === stepIndex && !isDone) {
            icon.textContent = "•";
            icon.classList.add("current");
            icon.classList.remove("done");
            stepText.classList.remove("done");
          } else {
            icon.textContent = index + 1;
            icon.classList.remove("done", "current");
            stepText.classList.remove("done");
          }
        });
      }
      if (info) {
        infoBox.textContent = info;
        infoBox.style.display = "block";
      } else {
        infoBox.style.display = "none";
      }
    }

    if (window.rsagentSplash && typeof window.rsagentSplash.onStatus === "function") {
      window.rsagentSplash.onStatus((payload) => {
        if (!payload) return;
        if (typeof payload.text === "string") {
          statusEl.textContent = payload.text;
          statusEl.classList.remove("success", "warning", "error", "loading");
          if (payload.text.includes("成功") || payload.text.includes("完成")) {
            statusEl.classList.add("success");
            updateStep(payload.text, true);
          } else if (payload.text.includes("检测") || payload.text.includes("安装") || 
                     payload.text.includes("解压") || payload.text.includes("启动")) {
            statusEl.classList.add("loading");
            updateStep(payload.text, false);
          } else {
            statusEl.classList.add("loading");
          }
        }
        if (typeof payload.footer === "string") {
          footerEl.textContent = payload.footer;
        }
        if (typeof payload.info === "string") {
          infoBox.textContent = payload.info;
          infoBox.style.display = "block";
        }
        if (typeof payload.progress === "number") {
          progressBar.classList.add("determinate");
          progressBar.style.width = `${payload.progress}%`;
        }
      });
    }
  </script>
</body>
</html>
